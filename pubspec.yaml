name: personalverwaltung
description: "FEGH-Verwaltung - Enterprise Personalverwaltung für Eingliederungshilfe"
publish_to: 'none'

version: 0.3.0-beta.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # UI Components & Layouts
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2719.3
  qr_flutter: ^4.1.0

  # Data Tables & Advanced UI
  data_table_2: ^2.5.12
  pluto_grid: ^8.0.0

  # Charts & Visualizations
  syncfusion_flutter_charts: ^32.1.23
  fl_chart: ^0.69.0
  syncfusion_flutter_gauges: ^32.1.23
  syncfusion_flutter_calendar: ^32.1.23
  syncfusion_flutter_datepicker: ^32.1.23

  # PDF Generation & Reports
  pdf: ^3.11.1
  printing: ^5.13.2

  # File Operations
  file_picker: ^8.0.6
  file_saver: ^0.2.13
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local Storage
  sqlite3_flutter_libs: ^0.5.0

  # HTTP & WebDAV
  http: ^1.2.2
  dio: ^5.4.3+1
  webdav_client: ^1.2.2

  # Date & Time
  intl: ^0.20.2
  table_calendar: ^3.1.2

  # Utilities
  uuid: ^4.4.2
  crypto: ^3.0.3
  cryptography: ^2.7.0

  # Geteiltes Wire-Format mit FEGH-Dokumentation
  fegh_crypto:
    path: ../fegh-shared/fegh_crypto
  # Geteilter Cloud-Storage-Adapter (WebDAV via webdav_client)
  fegh_cloud:
    path: ../fegh-shared/fegh_cloud
  # Rechnungsmodul (Models + XRechnung UBL 2.1)
  fegh_billing:
    path: ../fegh-shared/fegh_billing
  flutter_secure_storage: ^9.2.2
  logger: ^2.4.0
  shared_preferences: ^2.2.3
  xml: ^6.5.0

  # Desktop Integration
  window_manager: ^0.3.9
  url_launcher: ^6.3.0

  # Excel & CSV
  excel: ^4.0.3
  csv: ^6.0.0

  # JSON & Serialization
  json_annotation: ^4.9.0

  # Responsive Design
  responsive_framework: ^1.4.0
  syncfusion_flutter_datagrid: ^32.1.23

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

