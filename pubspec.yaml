name: personalverwaltung
description: "FEGH-Verwaltung - Enterprise Personalverwaltung für Eingliederungshilfe"
publish_to: 'none'

version: 0.3.0-beta.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # UI Components & Layouts
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2719.3
  qr_flutter: ^4.1.0

  # Data Tables & Advanced UI
  data_table_2: ^2.5.12
  pluto_grid: ^8.0.0

  # Charts & Visualizations
  syncfusion_flutter_charts: ^32.1.23
  fl_chart: ^0.69.0
  syncfusion_flutter_gauges: ^32.1.23
  syncfusion_flutter_calendar: ^32.1.23
  syncfusion_flutter_datepicker: ^32.1.23

  # PDF Generation & Reports
  pdf: ^3.11.1
  printing: ^5.13.2

  # File Operations
  file_picker: ^8.0.6
  file_saver: ^0.2.13
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local Storage
  sqlite3_flutter_libs: ^0.5.0

  # HTTP & WebDAV
  http: ^1.2.2
  dio: ^5.4.3+1
  webdav_client: ^1.2.2

  # Date & Time
  intl: ^0.20.2
  table_calendar: ^3.1.2

  # Utilities
  uuid: ^4.4.2
  crypto: ^3.0.3
  cryptography: ^2.7.0

  # Geteilte Pakete aus dem fegh-shared Repo
  # Lokal arbeiten? Siehe pubspec_overrides.yaml (path-Overrides)
  fegh_crypto:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_crypto
  fegh_cloud:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_cloud
  fegh_billing:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_billing
  fegh_compliance:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_compliance
  fegh_auth_oidc:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_auth_oidc
  fegh_pdf_kit:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_pdf_kit
  fegh_backup:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_backup
  fegh_chat:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_chat
  fegh_core:
    git:
      url: https://github.com/miri2577/fegh-shared.git
      path: fegh_core
  flutter_secure_storage: ^9.2.2
  logger: ^2.4.0
  signature: ^5.4.0
  shared_preferences: ^2.2.3
  xml: ^6.5.0

  # Desktop Integration
  window_manager: ^0.3.9
  url_launcher: ^6.3.0

  # Excel & CSV
  excel: ^4.0.3
  csv: ^6.0.0

  # JSON & Serialization
  json_annotation: ^4.9.0

  # Responsive Design
  responsive_framework: ^1.4.0
  syncfusion_flutter_datagrid: ^32.1.23

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Windows-MSIX-Build (Intune/MDM-kompatibles Installer-Format)
  msix: ^3.16.7

# ── MSIX-Build-Konfiguration ─────────────────────────────────────
# Erzeugt ein MSIX-Paket mit:
#   flutter pub run msix:create
#
# Siehe scripts/build-msix.ps1 fuer den vollstaendigen Build-Flow
# inkl. Code-Signing.
msix_config:
  display_name: FEGH-Verwaltung
  publisher_display_name: FEGH
  identity_name: com.fegh.verwaltung
  # Publisher: muss mit dem Subject eines Code-Signing-Zertifikats
  # uebereinstimmen. Fuer interne Verteilung reicht ein selbst
  # signiertes Zertifikat; fuer Store-Distribution braucht's ein
  # EV-Code-Signing-Zertifikat.
  publisher: CN=FEGH
  msix_version: 0.3.0.0
  logo_path: linux/runner/app_icon.png
  # Start-Menue + Desktop-Shortcut werden automatisch erzeugt.
  # Fuer Enterprise: Unattended-Install via Intune Win32-App.
  capabilities: internetClient
  architecture: x64
  store: false
  install_certificate: false
  trim_logo: false
  # Runtime-Bibliotheken packt MSIX automatisch ein (Flutter Engine,
  # MS VC++ Redistributable). Keine zusaetzlichen Dependencies noetig.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
